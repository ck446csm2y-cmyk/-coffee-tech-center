name: Avito controlled publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/avito-readonly-check.yml

permissions:
  contents: read

jobs:
  publish-avito-feed:
    name: Publish controlled Avito feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
      AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
      AVITO_USER_ID: ${{ secrets.AVITO_USER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Point Autoload to controlled feed and launch upload
        run: python3 scripts/avito_publish.py
